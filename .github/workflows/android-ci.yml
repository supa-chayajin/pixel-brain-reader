# Gate for every push: unit tests (incl. the guard tests), Android Lint at 0 errors / 0 warnings
# (warnings fail the build — see `lint { warningsAsErrors }`), and a debug build.
# The 470 MB embedding model is a Git LFS object and is NOT fetched: no test loads it, and the
# build packages whatever sits at the asset path.
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 (Android 17) may not be pre-installed on the runner image.
      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null || true

      - name: Unit tests, lint, debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
