# Location
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# HTML Parsing & Conversion
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
flexmark-html2md-converter = { group = "com.vladsch.flexmark", name = "flexmark-html2md-converter", version.ref = "flexmark" }
markwon-html = { group = "io.noties.markwon", name = "html", version.ref = "markwonHtml" }

# AI Core & MediaPipe
mediapipe-tasks-text = { group = "com.google.mediapipe", name = "tasks-text", version.ref = "mediaPipeText" }
# Local sentence embeddings (multilingual MiniLM): raw TFLite Interpreter +
# HuggingFace-format tokenizer via DJL. Replaces the MediaPipe TextEmbedder
# path which was locked to the 100-dim English-only USE-Lite model.
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
djl-huggingface-tokenizers = { group = "ai.djl.huggingface", name = "tokenizers", version.ref = "djlTokenizers" }
# The base `tokenizers` JAR only carries JNI bindings + native .so for desktop
# ABIs (linux/osx). The Android .so live in this companion AAR — without it,
# the first encode() call throws UnsatisfiedLinkError on-device.
djl-android-tokenizer-native = { group = "ai.djl.android", name = "tokenizer-native", version.ref = "djlTokenizers" }
kotlinx-coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "coroutinesGuava" }

# Jetpack Glance
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Test
